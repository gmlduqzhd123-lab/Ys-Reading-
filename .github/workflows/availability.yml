name: Bookforest availability
on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bookforest-availability
  cancel-in-progress: false
jobs:
  public-service:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-availability.mjs
        id: probe
      - name: Notify one incident and its recovery
        if: always() && steps.probe.outcome != 'skipped' && !cancelled()
        run: node scripts/notify-incident.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
