name: Bookforest browser journey
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bookforest-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-classroom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start isolated database and Auth
        run: node scripts/ci-start.mjs
      - name: Start isolated account worker
        run: npx --no-install supabase functions serve account-operations --no-verify-jwt > "$RUNNER_TEMP/bookforest-edge.log" 2>&1 &
      - name: Seed synthetic accounts only
        id: fixtures
        run: npx tsx scripts/ci-bootstrap.ts
      - name: Verify database and worker compatibility
        run: node scripts/check-release-contract.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify classroom and teacher journey
        id: classroom
        run: npx playwright test --project chromium
      - name: Inspect synthetic browser failure context
        if: failure() && steps.classroom.outcome == 'failure'
        run: node scripts/ci-failure-context.mjs
      - name: Verify mobile learning and accessibility
        run: npx playwright test --project webkit-mobile
      - name: Verify 90 concurrent student flows across three classes
        id: load
        if: always() && steps.fixtures.outcome == 'success' && !cancelled()
        run: npx tsx scripts/ci-concurrency.ts
      - name: Verify delegated teacher and account worker permissions
        id: collaboration
        if: always() && steps.load.outcome == 'success' && !cancelled()
        run: npx tsx scripts/ci-collaboration.ts
      - name: Verify portable backup and independent Auth restore
        if: always() && steps.classroom.outcome == 'success' && steps.collaboration.outcome == 'success' && !cancelled()
        run: npx tsx scripts/ci-recovery-drill.ts
      - name: Verify 30000 historical records and scoped search performance
        if: always() && steps.collaboration.outcome == 'success' && !cancelled()
        run: npx tsx scripts/ci-record-scale.ts
      - name: Stop isolated services
        if: always()
        run: npx --no-install supabase stop --no-backup
