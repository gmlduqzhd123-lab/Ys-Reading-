name: Bookforest availability
on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bookforest-availability
  cancel-in-progress: false
jobs:
  public-service:
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-availability.mjs
        id: probe
      - name: Notify one incident and its recovery
        id: notify-service
        if: always() && steps.probe.outcome != 'skipped' && !cancelled()
        run: node scripts/notify-incident.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check independent backup heartbeat
        if: always() && !cancelled()
        id: backup
        continue-on-error: true
        run: node scripts/check-backup.mjs
      - name: Notify backup incident and recovery
        id: notify-backup
        if: always() && steps.backup.outcome != 'skipped' && !cancelled()
        run: node scripts/notify-incident.mjs --backup
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Confirm backup incident delivery without repeated failure emails
        if: always() && !cancelled()
        run: node scripts/check-backup-notification.mjs
      - name: Check independent notification delivery and retry pending incidents
        if: always() && !cancelled()
        run: node scripts/notify-monitor-delivery.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVICE_NOTIFY_OUTCOME: ${{ steps.notify-service.outcome }}
          BACKUP_NOTIFY_OUTCOME: ${{ steps.notify-backup.outcome }}
      - name: Generate bounded operational readiness report
        if: always() && !cancelled()
        run: node scripts/operations-report.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && !cancelled()
        with:
          name: operations-readiness
          path: operations-report.json
          retention-days: 14
